name: Build CicadaPlayer iOS Framework

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cicadaplayer.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout CicadaPlayer
        uses: actions/checkout@v4
        with:
          repository: alibaba/CicadaPlayer
          ref: master
          path: CicadaPlayer

      - name: Select Xcode
        run: |
          ls -1 /Applications | grep '^Xcode' || true
          for xcode in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode_16.1.app Xcode.app; do
            if [ -d "/Applications/${xcode}/Contents/Developer" ]; then
              sudo xcode-select -s "/Applications/${xcode}/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install automake libtool autoconf cmake yasm 2>/dev/null || true
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Patch build scripts for Xcode 16
        working-directory: ./CicadaPlayer
        run: |
          # Xcode 16 不再支持 bitcode，移除所有 -fembed-bitcode
          find . -type f \( -name "*.sh" -o -name "*.cmake" -o -name "CMakeLists.txt" \) -exec sed -i '' 's/-fembed-bitcode//g' {} \;
          # 只编译 arm64 真机，Xcode 16 SDK 不支持 armv7
          sed -i '' 's/IOS_ARCHS="arm64 x86_64"/IOS_ARCHS="arm64"/' build_tools/env.sh
          sed -i '' 's/VALID_ARCHS="armv7 arm64"/VALID_ARCHS="arm64"/' build_player.sh
          sed -i '' 's/set (IOS_ARCH armv7 arm64)/set (IOS_ARCH arm64)/' build_tools/iOS/iOS.cmake
          # 清理所有残留的 armv7 引用（OpenSSL 等依赖仍会尝试 armv7 链接）
          find . -type f \( -name "*.sh" -o -name "*.cmake" -o -name "CMakeLists.txt" -o -name "Config*.pm" \) -exec sed -i '' 's/armv7 //g; s/ armv7//g' {} \;
          # iOS 8.0 部署目标太老，改到 12.0 避免 SDK 兼容警告
          sed -i '' 's/DEPLOYMENT_TARGET="8.0"/DEPLOYMENT_TARGET="12.0"/' build_tools/iOSConfig.sh
          # 通过 build_alias 注入 x86_64 令 build≠host
          echo 'export build_alias=x86_64-apple-darwin' >> build_tools/env.sh

          # 修复 CURL_SOURCE_DIR 路径：
          # player_git_source_list.sh 把 curl clone 到 external/curl/
          # 但 user_env.sh 设置 CURL_SOURCE_DIR=$TOP_DIR/external/curl（而 TOP_DIR=external/）
          # 导致路径变成 external/external/curl/（不存在）
          # 改为正确的 $TOP_DIR/curl
          sed -i '' 's|CURL_SOURCE_DIR=$TOP_DIR/external/curl|CURL_SOURCE_DIR=$TOP_DIR/curl|' external/user_env.sh

          # 对应修复 patch_curl 的相对路径（../../contribute → ../contribute）
          sed -i '' 's|../../contribute/curl/|../contribute/curl/|' external/build_external.sh

          # curl 7.68.0 的 configure 含 bash 语法但 shebang 是 /bin/sh
          # 在 build_curl.sh 第 124 行把 configure 改为 bash 调用
          sed -i '' 's|^\t\+${CURL_SOURCE_DIR}/configure|		bash ${CURL_SOURCE_DIR}/configure|' build_tools/build_curl.sh

          # curl 7.63.0 configure.ac 部分 AC_RUN_IFELSE 缺少 cross-compile 回退参数
          # buildconf 调用 autoconf 重新生成 configure 后, 自动修补交叉编译 fatal error
          AU=$(which autoconf)
          cat > /tmp/autoconf << WRAP
          #!/bin/bash
          ${AU} "\$@"
          if [ -f configure ]; then
            sed -i '' 's|cannot run test program while cross compiling|& [XCOMP]|' configure
            sed -i '' '/as_fn_error.*cannot run test.*\[XCOMP\]/s|as_fn_error|true #|' configure
          fi
          WRAP
          chmod +x /tmp/autoconf
          export PATH="/tmp:${PATH}"

      - name: Build iOS SDK
        working-directory: ./CicadaPlayer
        env:
          ac_cv_func_malloc_0_nonnull: yes
          ac_cv_func_realloc_0_nonnull: yes
          build_alias: x86_64-apple-darwin
          SHELL: /bin/bash
        run: |
          export PATH="/tmp:${PATH}"
          export MUPP_BUILD_ID=$(date +%Y%m%d%H%M%S)
          export build_alias=x86_64-apple-darwin
          export SHELL=/bin/bash
          . setup.env
          build_iOS

      - name: Package Framework
        run: |
          mkdir -p CicadaPlayer-Release
          cp -R ./CicadaPlayer/output/CicadaPlayerSDK/SDK/ARM_SIMULATOR/CicadaPlayerSDK.framework CicadaPlayer-Release/ 2>/dev/null || \
          cp -R ./CicadaPlayer/output/CicadaPlayerSDK/SDK/ARM/CicadaPlayerSDK.framework CicadaPlayer-Release/
          # 同时复制依赖的 ffmpeg framework
          cp -R ./CicadaPlayer/output/CicadaPlayerSDK/SDK/ARM_SIMULATOR/alivcffmpeg.framework CicadaPlayer-Release/ 2>/dev/null || \
          cp -R ./CicadaPlayer/output/CicadaPlayerSDK/SDK/ARM/alivcffmpeg.framework CicadaPlayer-Release/
          ls -la CicadaPlayer-Release/
          zip -r CicadaPlayer-iOS-arm64.zip CicadaPlayer-Release/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cicadaplayer-ios-latest
          name: CicadaPlayer iOS Framework (arm64)
          body: |
            自动编译的 CicadaPlayer iOS framework
            - 来源：alibaba/CicadaPlayer master
            - 架构：arm64 (真机)
            - 包含依赖：alivcffmpeg.framework
          files: CicadaPlayer-iOS-arm64.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Quarkproxy.xcframework

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'go-proxy/**'
      - '.github/workflows/build-quarkproxy.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Select Xcode
        run: |
          set -euo pipefail
          for xcode in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode.app; do
            if [ -d "/Applications/${xcode}/Contents/Developer" ]; then
              sudo xcode-select -s "/Applications/${xcode}/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: 🐹 Cache Go modules & gomobile
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go-proxy/go.sum', 'go-proxy/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 🐹 Setup Go + gomobile + 构建 Quarkproxy.xcframework
        run: |
          set -euo pipefail
          # 安装 Go
          if ! command -v go &>/dev/null; then
            curl -sL https://go.dev/dl/go1.22.5.darwin-amd64.tar.gz -o /tmp/go.tar.gz
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            rm /tmp/go.tar.gz
            echo "/usr/local/go/bin" >> $GITHUB_PATH
          fi
          export PATH="/usr/local/go/bin:$PATH"

          # 防止 Go 自动升级工具链（最新 x/mobile 要求 go 1.26，会导致
          # 自动下载新工具链 + DNS 失败）。锁定为本地安装的 Go 1.22.5。
          export GOTOOLCHAIN=local
          # GOPROXY 多镜像 fallback，避免单一 proxy DNS 故障
          export GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct
          go version

          # 安装 gomobile（pin 到兼容 Go 1.22 的版本，避免 @latest 拉入
          # 要求 go 1.26+ 的新版本）
          MOBILE_PIN="b38b8813d6076f4e4ff25d71ee2c45f051a3a0cb"
          go install golang.org/x/mobile/cmd/gomobile@${MOBILE_PIN}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH="$(go env GOPATH)/bin:$PATH"

          # 在 go-proxy 模块中添加 golang.org/x/mobile 依赖
          # pin 到同一兼容版本，避免 go get @latest 拉入需要 go 1.26 的版本
          cd go-proxy
          go get golang.org/x/mobile@${MOBILE_PIN}
          # go mod tidy 可能因临时 DNS 故障失败，重试 3 次
          for attempt in 1 2 3; do
            if go mod tidy 2>&1; then
              break
            fi
            echo "⚠️ go mod tidy 第 ${attempt} 次失败，重试..."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done

          # 初始化 gomobile
          gomobile init || true

          # 构建 Quarkproxy.xcframework
          gomobile bind -target=ios/arm64 -o ../Quarkproxy.xcframework . 2>&1 || {
            echo "⚠️ arm64 失败，尝试通用 target"
            gomobile bind -target=ios -o ../Quarkproxy.xcframework . 2>&1
          }
          cd ..

          if [ ! -d Quarkproxy.xcframework ]; then
            echo "❌ Quarkproxy.xcframework 构建失败"
            exit 1
          fi

          echo "✅ Quarkproxy.xcframework 构建成功: $(du -sh Quarkproxy.xcframework | cut -f1)"

      - name: 📦 打包产物
        run: |
          set -euo pipefail
          TAG="quarkproxy-ios-arm64"
          TARBALL="${TAG}.tar.gz"
          tar czf "$TARBALL" Quarkproxy.xcframework
          echo "✅ 打包完成: $(du -h "$TARBALL" | cut -f1)"
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.TARBALL }}
          prerelease: false
          make_latest: false
          body: |
            Quarkproxy.xcframework 预编译产物
            - 架构: ios/arm64
            - Go 版本: 1.22.5
            - 触发: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

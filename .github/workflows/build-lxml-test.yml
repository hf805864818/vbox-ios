# ============================================================
# build-lxml-test.yml — lxml iOS 交叉编译独立测试 workflow
# ============================================================
# 阶段 1: 独立验证 workflow，不影响主构建 (build-ipa.yml)
#
# 触发方式:
#   - 手动触发 (workflow_dispatch)
#   - push 到 main 分支且仅 scripts/build_lxml_ios.sh 有改动时
#
# 目的:
#   验证 lxml + libxml2 + libxslt 能否在 iOS arm64 上成功交叉编译
#   编译产物上传为 artifact 供检查
#   不修改任何现有文件，不影响 App 构建
#
# 参考案例: build-quickjs.yml (相同的独立 workflow 模式)
# ============================================================

name: lxml 编译测试 (实验性)

on:
  workflow_dispatch:       # 手动触发
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_lxml_ios.sh'    # 仅在编译脚本变更时触发
      - '.github/workflows/build-lxml-test.yml'

jobs:
  build-lxml:
    runs-on: macos-15
    name: lxml iOS arm64 交叉编译

    steps:
      # ─── Checkout ───
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ─── 选择 Xcode ───
      - name: 🔧 Select Xcode
        run: |
          set -euo pipefail
          # 与 build-ipa.yml 相同的 Xcode 选择逻辑
          for xcode in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode.app; do
            if [ -d "/Applications/${xcode}/Contents/Developer" ]; then
              sudo xcode-select -s "/Applications/${xcode}/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      # ─── 安装 host Python 3.14 ───
      # lxml setup.py 需要用 Python 3.14 运行（与 iOS 目标版本一致）
      - name: 🐍 安装 host Python 3.14
        run: |
          if ! python3.14 --version 2>/dev/null; then
            echo "📦 安装 Python 3.14..."
            curl -sLO "https://www.python.org/ftp/python/3.14.6/python-3.14.6-macos11.pkg"
            sudo installer -pkg "python-3.14.6-macos11.pkg" -target / 2>&1 | tail -1
          fi
          export PATH="/Library/Frameworks/Python.framework/Versions/3.14/bin:$PATH"
          python3.14 --version
          echo "PATH=/Library/Frameworks/Python.framework/Versions/3.14/bin:$PATH" >> $GITHUB_ENV

      # ─── 执行 lxml 交叉编译 ───
      - name: 🏗️ 交叉编译 lxml (libxml2 + libxslt + lxml C 扩展)
        run: |
          set -euo pipefail
          bash scripts/build_lxml_ios.sh

      # ─── 上传编译产物 ───
      - name: 📤 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: lxml-ios-arm64-py314
          path: |
            /tmp/lxml-build/output/lxml/
            /tmp/lxml-build/output/lib/
            /tmp/lxml-build/output/include/
            /tmp/lxml-build/output/VERIFY_REPORT.txt
          retention-days: 30

      # ─── 输出验证摘要 ───
      - name: 📋 验证摘要
        run: |
          echo "============================================"
          echo "📋 lxml 交叉编译验证摘要"
          echo "============================================"
          echo ""
          if [ -f /tmp/lxml-build/output/VERIFY_REPORT.txt ]; then
            cat /tmp/lxml-build/output/VERIFY_REPORT.txt
          else
            echo "⚠️ 验证报告未生成"
          fi
          echo ""
          echo "============================================"
          echo "✅ 编译产物已上传为 artifact: lxml-ios-arm64-py314"
          echo "   可在 GitHub Actions 页面下载查看"
          echo "============================================"

name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    outputs:
      MARKETING_VERSION: ${{ steps.get_version.outputs.MARKETING_VERSION }}
      BUILD_NUM: ${{ steps.get_version.outputs.BUILD_NUM }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 记录构建开始时间
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 🔧 Select Xcode
        run: |
          set -euo pipefail
          ls -1 /Applications | grep '^Xcode' || true
          for xcode in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode.app; do
            if [ -d "/Applications/${xcode}/Contents/Developer" ]; then
              sudo xcode-select -s "/Applications/${xcode}/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: 🐍 Build CPython 3.12 for iOS arm64
        run: |
          set -euo pipefail
          PYTHON_VERSION="3.12.4"
          echo "🐍 编译 CPython ${PYTHON_VERSION} for iOS arm64..."

          # 下载 Python 源码
          curl -sLO "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tar.xz"
          tar xf "Python-${PYTHON_VERSION}.tar.xz"
          cd "Python-${PYTHON_VERSION}"

          # 交叉编译 arm64 静态库
          export CC="xcrun -sdk iphoneos clang -arch arm64"
          export CXX="xcrun -sdk iphoneos clang++ -arch arm64"
          export CFLAGS="-mios-version-min=15.0 -O2 -fembed-bitcode"
          export LDFLAGS="-mios-version-min=15.0"

          ./configure \
            --host=aarch64-apple-darwin \
            --build=x86_64-apple-darwin \
            --enable-static \
            --disable-shared \
            --without-ensurepip \
            --without-doc-strings \
            --disable-test-modules \
            --without-lzma \
            --without-bz2 \
            ac_cv_file__dev_ptmx=no \
            ac_cv_file__dev_ptc=no

          make -j$(sysctl -n hw.ncpu) 2>&1 | tail -10

          # 复制产物
          cp libpython3.12.a ../vbox/Libraries/libpython3.12.a
          cp Python.h Include/ ../vbox/Libraries/Python/ -r
          echo "✅ libpython3.12.a 已编译: $(ls -lh ../vbox/Libraries/libpython3.12.a)"

          # 精简标准库到 ~6MB
          echo "🐍 精简 Python 标准库..."
          cd ..
          STDLIB_SRC="Python-${PYTHON_VERSION}/Lib"
          STDLIB_DST="vbox/Resources/python-stdlib"
          mkdir -p "${STDLIB_DST}/site-packages"

          # 复制核心模块
          for mod in __future__ abc.py ast.py base64.py binascii.py bisect.py \
            calendar.py codecs.py collections contextlib.py copy.py copyreg.py \
            csv.py dataclasses.py datetime.py email encodings enum.py \
            fnmatch.py fractions.py functools.py genericpath.py getopt.py \
            gzip.py hashlib.py heapq.py html http importlib inspect.py \
            io.py ipaddress.py json keyword.py linecache.py logging \
            math.py ntpath.py numbers.py opcode.py operator.py os.py \
            pathlib.py pickle.py posixpath.py pprint.py queue.py \
            quopri.py random.py re reprlib.py selectors.py shlex.py \
            shutil.py site.py socket.py sqlite3 sre_compile.py \
            sre_constants.py sre_parse.py ssl.py stat.py string.py \
            struct.py tarfile.py tempfile.py textwrap.py threading.py \
            token.py tokenize.py traceback.py types.py typing.py \
            unicodedata.py urllib uuid.py warnings.py weakref.py \
            _collections_abc.py _compat_pickle.py _compression.py \
            _markupbase.py _osx_support.py _py_abc.py _sitebuiltins.py \
            _strptime.py _threading_local.py _weakrefset.py zipfile; do
            if [ -f "${STDLIB_SRC}/${mod}" ]; then
              cp "${STDLIB_SRC}/${mod}" "${STDLIB_DST}/${mod}"
            elif [ -d "${STDLIB_SRC}/${mod}" ]; then
              mkdir -p "${STDLIB_DST}/${mod}"
              cp -r "${STDLIB_SRC}/${mod}/"* "${STDLIB_DST}/${mod}/"
            fi
          done

          # 复制用户自定义模块
          cp -r vbox/Resources/python-stdlib/base "${STDLIB_DST}/base"
          cp -r vbox/Resources/python-stdlib/site-packages "${STDLIB_DST}/site-packages" 2>/dev/null || true

          echo "📦 标准库大小: $(du -sh ${STDLIB_DST} | cut -f1)"

      - name: 🎬 Fetch MPVKit dependencies
        run: |
          bash scripts/fetch_mpv_dependencies.sh --cache-dir .mpv-cache
          python3 scripts/fetch_mpv_external_dependencies.py --all --cache-dir .mpv-cache/external
          python3 scripts/check_mpv_installed_dependencies.py

      - name: 🔗 Inject MPVKit Link & Embed
        run: |
          gem install xcodeproj --no-document
          ruby scripts/configure_mpvkit_link.rb

      - name: 🔧 修复 PushPlayView/PushPlayStore 路径 (mpvkit脚本后)
        run: python3 scripts/fix_pushplay_pbxproj.py

      - name: 🔢 自动递增版本号
        run: |
          # 读取当前版本号
          CURRENT_VERSION=$(plutil -extract CFBundleShortVersionString raw vbox/Info.plist)
          CURRENT_BUILD=$(plutil -extract CFBundleVersion raw vbox/Info.plist)
          echo "当前版本: $CURRENT_VERSION (build $CURRENT_BUILD)"

          # 解析版本号: 3.335 -> 3.336
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR"
          NEW_BUILD=$((CURRENT_BUILD + 1))

          echo "新版本: $NEW_VERSION (build $NEW_BUILD)"

          # 更新 Info.plist
          plutil -replace CFBundleShortVersionString -string "$NEW_VERSION" vbox/Info.plist
          plutil -replace CFBundleVersion -string "$NEW_BUILD" vbox/Info.plist

          # 更新 project.pbxproj
          sed -i '' "s/MARKETING_VERSION = $CURRENT_VERSION;/MARKETING_VERSION = $NEW_VERSION;/g" vbox.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = $CURRENT_BUILD;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" vbox.xcodeproj/project.pbxproj

          # 更新 .version 文件
          echo "MAJOR_VERSION=$MAJOR" > .version
          echo "BASE_BUILD=$NEW_BUILD" >> .version

          # 提交版本号更新
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vbox/Info.plist vbox.xcodeproj/project.pbxproj .version
          git commit -m "ci: auto bump version to $NEW_VERSION (build $NEW_BUILD)" || true
          git push origin main || true

      - name: 📖 获取版本号
        id: get_version
        run: |
          MARKETING_VERSION=$(plutil -extract CFBundleShortVersionString raw vbox/Info.plist)
          BUILD_NUM=$(plutil -extract CFBundleVersion raw vbox/Info.plist)
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Version: $MARKETING_VERSION Build: $BUILD_NUM"

      - name: 📦 Install CocoaPods dependencies
        run: |
          sudo gem install cocoapods --no-document
          # MobileVLCKit 的下载服务器 download.videolan.org 经常超时，需要重试
          for attempt in 1 2 3 4 5; do
            echo "📦 第 ${attempt}/5 次尝试 pod install"
            if pod install --repo-update; then
              echo "✅ CocoaPods 安装成功"
              exit 0
            fi
            echo "⚠️ pod install 失败，清理后重试..."
            rm -rf Pods Podfile.lock
            pod cache clean --all 2>/dev/null || true
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "❌ pod install 多次重试后仍失败"
          exit 1

      - name: 🔧 修复 PushPlayView/PushPlayStore 路径 (pod install 后)
        run: python3 scripts/fix_pushplay_pbxproj.py

      - name: 🏗️ Clean
        run: |
          set -o pipefail
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.llvm.clang/*
          xcodebuild -workspace vbox.xcworkspace -scheme vbox \
            -configuration Release \
            -destination generic/platform=iOS \
            clean 2>&1

      - name: 🏗️ Build
        run: |
          set -o pipefail
          BUILD_CMD="xcodebuild -workspace vbox.xcworkspace -scheme vbox"
          $BUILD_CMD \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            MARKETING_VERSION=${{ steps.get_version.outputs.MARKETING_VERSION }} \
            CURRENT_PROJECT_VERSION=${{ steps.get_version.outputs.BUILD_NUM }} \
            HEADER_SEARCH_PATHS="\$(SRCROOT)/vbox/Libraries/Python" \
            LIBRARY_SEARCH_PATHS="\$(SRCROOT)/vbox/Libraries" \
            OTHER_LDFLAGS="-lpython3.12 -lz" \
            build 2>&1

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          [ -z "$APP" ] && echo "No .app!" && exit 1
          rm -rf "$APP/_CodeSignature" "$APP/archived-expanded-entitlements.xcent" 2>/dev/null
          [ ! -f "$APP/vbox" ] && echo "No vbox!" && exit 1
          MPVKIT_FRAMEWORK="$APP/Frameworks/MPVKit.framework"
          if [ -f "$MPVKIT_FRAMEWORK/MPVKit" ] && [ ! -f "$MPVKIT_FRAMEWORK/MPVKitWrapper" ]; then
            echo "修复 MPVKit install name 文件名不一致：复制 MPVKit -> MPVKitWrapper"
            cp "$MPVKIT_FRAMEWORK/MPVKit" "$MPVKIT_FRAMEWORK/MPVKitWrapper"
          fi
          if [ -d "$MPVKIT_FRAMEWORK" ]; then
            echo "MPVKit.framework 内容："
            ls -la "$MPVKIT_FRAMEWORK"
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r vbox.ipa Payload/
          echo "IPA: $(ls -lh vbox.ipa)"

      - name: 📝 生成 Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.MARKETING_VERSION }}"
          BUILD="${{ steps.get_version.outputs.BUILD_NUM }}"

          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -1)

          NOTES=""

          if [ -n "$PREVIOUS_TAG" ]; then
            RAW_COMMITS=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"%s" --no-merges 2>/dev/null | \
              grep -v "^ci: auto bump" | \
              grep -v "^docs: 自动更新" | \
              grep -v "^docs: 新增 CHANGELOG" || true)
          else
            RAW_COMMITS=$(git log -30 --pretty=format:"%s" --no-merges 2>/dev/null | \
              grep -v "^ci: auto bump" | \
              grep -v "^docs: 自动更新" | \
              grep -v "^docs: 新增 CHANGELOG" || true)
          fi

          if [ -n "$RAW_COMMITS" ]; then
            FEAT_ITEMS=$(echo "$RAW_COMMITS" | grep -iE "^feat" | sed -E 's/^[[:space:]]*(feat|feature)[[:space:]]*:[[:space:]]*//I' || true)
            FIX_ITEMS=$(echo "$RAW_COMMITS" | grep -iE "^fix" | sed -E 's/^[[:space:]]*fix[[:space:]]*:[[:space:]]*//I' || true)
            OTHER_ITEMS=$(echo "$RAW_COMMITS" | grep -viE "^(feat|feature|fix)" | head -20 || true)

            NOTES="## 修复\n\n"
            if [ -n "$FIX_ITEMS" ]; then
              echo "$FIX_ITEMS" | awk '{print "- "$0}' >> /tmp/notes_fix.txt
              NOTES+=$(cat /tmp/notes_fix.txt)
              NOTES+="\n"
            else
              NOTES+="_无_\n"
            fi

            NOTES+="\n## 新增\n\n"
            if [ -n "$FEAT_ITEMS" ]; then
              echo "$FEAT_ITEMS" | awk '{print "- "$0}' >> /tmp/notes_feat.txt
              NOTES+=$(cat /tmp/notes_feat.txt)
              NOTES+="\n"
            else
              NOTES+="_无_\n"
            fi

            if [ -n "$OTHER_ITEMS" ]; then
              NOTES+="\n## 其他变更\n\n"
              echo "$OTHER_ITEMS" | awk '{print "- "$0}' >> /tmp/notes_other.txt
              NOTES+=$(cat /tmp/notes_other.txt)
              NOTES+="\n"
            fi
          fi

          if [ -z "$NOTES" ]; then
            NOTES="版本 v$VERSION (build $BUILD)"
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo -e "$NOTES" > release_notes.txt
          echo "=== 生成 Release Notes ==="
          cat release_notes.txt

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

      - name: 📤 Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.txt

      - name: 🚀 Release to A Repo
        run: |
          VERSION="v${{ steps.get_version.outputs.MARKETING_VERSION }}"
          echo "🚀 创建 A 仓库 Release: $VERSION"
          for attempt in 1 2 3 4 5; do
            echo "第 ${attempt}/5 次尝试创建 Release"
            gh release delete "$VERSION" --yes 2>/dev/null || true
            if gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.txt \
              vbox.ipa; then
              echo "✅ A 仓库 Release 创建成功"
              exit 0
            fi
            echo "⚠️ A 仓库 Release 创建失败，可能是 GitHub 临时 5xx 或上传接口异常"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "❌ A 仓库 Release 多次重试后仍失败"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 📧 发送邮件通知
        if: always() && !cancelled()
        continue-on-error: true
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
          MARKETING_VERSION: ${{ steps.get_version.outputs.MARKETING_VERSION }}
          BUILD_NUM: ${{ steps.get_version.outputs.BUILD_NUM }}
        run: python3 scripts/send_build_notification.py

  sync-b-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: vbox-ipa
          path: ./vbox-ipa

      - name: 📥 Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./release-notes

      - name: 🚀 Sync Release to B Repo
        env:
          B_REPO_TOKEN: ${{ secrets.B_REPO_TOKEN }}
          B_REPO_OWNER: ${{ secrets.B_REPO_OWNER }}
          B_REPO_NAME: ${{ secrets.B_REPO_NAME }}
        run: |
          set -x

          echo "=== B_REPO_TOKEN 是否配置: $(if [ -n "$B_REPO_TOKEN" ]; then echo 'YES (长度:'${#B_REPO_TOKEN}')'; else echo 'NO'; fi) ==="
          echo "=== B_REPO_OWNER: '${B_REPO_OWNER}' ==="
          echo "=== B_REPO_NAME: '${B_REPO_NAME}' ==="

          if [ -z "$B_REPO_TOKEN" ] || [ -z "$B_REPO_OWNER" ] || [ -z "$B_REPO_NAME" ]; then
            echo "⚠️ B 仓库 Secret 未配置，跳过同步"
            echo "请在仓库 Settings > Secrets and variables > Actions 中配置:"
            echo "  - B_REPO_TOKEN (需要 repo 权限的 Personal Access Token)"
            echo "  - B_REPO_OWNER (B仓库所有者)"
            echo "  - B_REPO_NAME (B仓库名称)"
            echo "注意：Secrets 必须配置在 Repository 级别，不是 Environment 级别"
            exit 0
          fi

          echo "🔍 验证 Token 权限..."
          echo "$B_REPO_TOKEN" | gh auth login --with-token --hostname github.com 2>&1 || true
          gh auth status 2>&1 || true
          if ! GH_TOKEN="$B_REPO_TOKEN" gh repo view $B_REPO_OWNER/$B_REPO_NAME --json name,owner 2>&1; then
            echo "❌ 无法访问 B 仓库 $B_REPO_OWNER/$B_REPO_NAME"
            exit 1
          fi

          IPA_PATH=$(find ./vbox-ipa -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ 未找到 IPA 文件"
            ls -la ./vbox-ipa/
            exit 1
          fi
          echo "✅ IPA: $IPA_PATH"

          VERSION="v${{ needs.build.outputs.MARKETING_VERSION }}"
          echo "同步版本: $VERSION"

          B_REPO_EMPTY=$(gh repo view $B_REPO_OWNER/$B_REPO_NAME --json isEmpty -q '.isEmpty' 2>/dev/null || echo "true")
          echo "B_REPO_EMPTY=$B_REPO_EMPTY"
          if [ "$B_REPO_EMPTY" = "true" ]; then
            echo "📦 B 仓库为空，初始化..."
            gh repo clone $B_REPO_OWNER/$B_REPO_NAME /tmp/b-repo 2>&1 || true
            if [ -d "/tmp/b-repo/.git" ]; then
              cd /tmp/b-repo
              echo "# vbox-release" > README.md
              git add . && git commit -m "init" && git push origin main
              cd -
            fi
            rm -rf /tmp/b-repo
          fi

          echo "🗑️ 删除旧 Release..."
          GH_TOKEN="$B_REPO_TOKEN" gh release delete "$VERSION" --yes --repo $B_REPO_OWNER/$B_REPO_NAME 2>&1 || echo "旧 Release 不存在"

          NOTES_FILE=$(find ./release-notes -name "release_notes.txt" -type f | head -1)
          if [ -z "$NOTES_FILE" ]; then
            echo "⚠️ 未找到 release_notes.txt，使用默认说明"
            NOTES_FILE=""
          else
            echo "✅ Release Notes: $NOTES_FILE"
          fi

          echo "🚀 创建 Release $VERSION..."
          for attempt in 1 2 3 4 5; do
            echo "第 ${attempt}/5 次尝试创建 B 仓库 Release"
            if [ -n "$NOTES_FILE" ]; then
              if GH_TOKEN="$B_REPO_TOKEN" gh release create "$VERSION" \
                --repo $B_REPO_OWNER/$B_REPO_NAME \
                --title "$VERSION" \
                --notes-file "$NOTES_FILE" \
                "$IPA_PATH"; then
                echo "✅ B 仓库 Release 创建成功"
                echo "✅ 同步完成"
                exit 0
              fi
            else
              if GH_TOKEN="$B_REPO_TOKEN" gh release create "$VERSION" \
                --repo $B_REPO_OWNER/$B_REPO_NAME \
                --title "$VERSION" \
                --notes "版本 $VERSION" \
                "$IPA_PATH"; then
                echo "✅ B 仓库 Release 创建成功"
                echo "✅ 同步完成"
                exit 0
              fi
            fi
            echo "⚠️ B 仓库 Release 创建失败，可能是 GitHub 临时 5xx 或上传接口异常"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "❌ B 仓库 Release 多次重试后仍失败"
          exit 1

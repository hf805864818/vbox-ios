name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 🎨 Generate AppIcon
        run: |
          python3 -c "
          import struct, zlib
          def create_png(width, height, color=(30, 30, 30)):
              raw = b''
              for y in range(height):
                  raw += b'\x00'
                  for x in range(width):
                      raw += bytes([color[0], color[1], color[2], 255])
              def chunk(chunk_type, data):
                  c = chunk_type + data
                  crc = struct.pack('>I', zlib.crc32(c) & 0xFFFFFFFF)
                  return struct.pack('>I', len(data)) + c + crc
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
              compressed = zlib.compress(raw)
              return sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', compressed) + chunk(b'IEND', b'')
          icon = create_png(1024, 1024)
          with open('vbox/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png', 'wb') as f:
              f.write(icon)
          print(f'✅ AppIcon: {len(icon)} bytes')
          "

      - name: 🏗️ Build for TrollStore
        run: |
          xcodebuild -project vbox.xcodeproj \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            -derivedDataPath ./Build 2>&1 | tee build.log | tail -30

      - name: 📦 Package IPA
        run: |
          # 查找编译出的 .app
          APP_PATH=$(find ./Build -name "*.app" -type d | head -1)
          echo "Found .app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found! Checking build log..."
            tail -100 build.log
            exit 1
          fi
          
          # 确认app内容
          echo "App contents:"
          ls -la "$APP_PATH"
          
          # 创建 Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # 压缩成 ipa
          zip -r vbox.ipa Payload/
          
          echo "✅ IPA size: $(ls -lh vbox.ipa | awk '{print $5}')"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

      - name: ℹ️ Summary
        run: |
          echo "## ✅ vbox IPA 编译完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | \`com.vbox.iosplayer\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 | 1.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| 最低iOS | 15.0 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ 下载 **vbox-ipa** 工件中的 \`vbox.ipa\` 文件" >> $GITHUB_STEP_SUMMARY
          echo "📱 用 TrollStore 打开安装" >> $GITHUB_STEP_SUMMARY

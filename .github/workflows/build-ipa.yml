name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: |
          set -euo pipefail
          ls -1 /Applications | grep '^Xcode' || true
          for xcode in Xcode_16.4.app Xcode_16.3.app Xcode_16.2.app Xcode.app; do
            if [ -d "/Applications/${xcode}/Contents/Developer" ]; then
              sudo xcode-select -s "/Applications/${xcode}/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: 🎬 Fetch MPVKit dependencies
        run: |
          bash scripts/fetch_mpv_dependencies.sh --cache-dir .mpv-cache
          python3 scripts/fetch_mpv_external_dependencies.py --all --cache-dir .mpv-cache/external
          python3 scripts/check_mpv_installed_dependencies.py

      - name: 🔗 Inject MPVKit Link & Embed
        run: |
          gem install xcodeproj --no-document
          ruby scripts/configure_mpvkit_link.rb

      - name: 📖 获取版本号
        id: get_version
        run: |
          MARKETING_VERSION=$(plutil -extract CFBundleShortVersionString raw vbox/Info.plist)
          BUILD_NUM=$(plutil -extract CFBundleVersion raw vbox/Info.plist)
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Version: $MARKETING_VERSION Build: $BUILD_NUM"

      - name: 📦 Install CocoaPods dependencies
        run: |
          sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: 🏗️ Build
        run: |
          set -o pipefail
          xcodebuild -workspace vbox.xcworkspace \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            MARKETING_VERSION=${{ steps.get_version.outputs.MARKETING_VERSION }} \
            CURRENT_PROJECT_VERSION=${{ steps.get_version.outputs.BUILD_NUM }} \
            build 2>&1

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          [ -z "$APP" ] && echo "No .app!" && exit 1
          rm -rf "$APP/_CodeSignature" "$APP/archived-expanded-entitlements.xcent" 2>/dev/null
          [ ! -f "$APP/vbox" ] && echo "No vbox!" && exit 1
          MPVKIT_FRAMEWORK="$APP/Frameworks/MPVKit.framework"
          if [ -f "$MPVKIT_FRAMEWORK/MPVKit" ] && [ ! -f "$MPVKIT_FRAMEWORK/MPVKitWrapper" ]; then
            echo "修复 MPVKit install name 文件名不一致：复制 MPVKit -> MPVKitWrapper"
            cp "$MPVKIT_FRAMEWORK/MPVKit" "$MPVKIT_FRAMEWORK/MPVKitWrapper"
          fi
          if [ -d "$MPVKIT_FRAMEWORK" ]; then
            echo "MPVKit.framework 内容："
            ls -la "$MPVKIT_FRAMEWORK"
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r vbox.ipa Payload/
          echo "IPA: $(ls -lh vbox.ipa)"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

      - name: 🚀 Release to A Repo
        run: |
          gh release delete "v${{ steps.get_version.outputs.MARKETING_VERSION }}" --yes 2>/dev/null || true
          gh release create "v${{ steps.get_version.outputs.MARKETING_VERSION }}" \
            --title "v${{ steps.get_version.outputs.MARKETING_VERSION }}" \
            --notes "版本 ${{ steps.get_version.outputs.MARKETING_VERSION }} (build ${{ steps.get_version.outputs.BUILD_NUM }})" \
            vbox.ipa
        env:
          GH_TOKEN: ${{ github.token }}

  sync-b-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download IPA
        uses: actions/download-artifact@v4
        with:
          name: vbox-ipa
          path: ./vbox-ipa

      - name: 📖 获取版本号
        id: get_version
        run: |
          # 从 A 仓库的 Release 标签获取版本号
          VERSION=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            VERSION="v3.264"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "同步版本: $VERSION"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🚀 Sync Release to B Repo
        run: |
          # 检查 B 仓库配置是否完整
          if [ -z "$B_REPO_TOKEN" ] || [ -z "$B_REPO_OWNER" ] || [ -z "$B_REPO_NAME" ]; then
            echo "⚠️ B 仓库 Secret 未配置，跳过同步"
            exit 0
          fi
          # 查找 IPA 文件
          IPA_PATH=$(find ./vbox-ipa -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ 未找到 IPA 文件"
            exit 1
          fi
          echo "✅ B 仓库配置完整，IPA: $IPA_PATH，开始同步到 $B_REPO_OWNER/$B_REPO_NAME"
          
          # 检查 B 仓库是否有初始提交，没有则创建一个
          B_REPO_EXISTS=$(gh repo view $B_REPO_OWNER/$B_REPO_NAME --json isEmpty -q '.isEmpty' 2>/dev/null || echo "true")
          if [ "$B_REPO_EXISTS" = "true" ]; then
            echo "📦 B 仓库为空，初始化..."
            gh repo clone $B_REPO_OWNER/$B_REPO_NAME /tmp/b-repo 2>/dev/null || true
            cd /tmp/b-repo
            echo "# vbox-release" > README.md
            echo "自动同步的 IPA 发布仓库" >> README.md
            git add . && git commit -m "init" && git push origin main
            cd -
            rm -rf /tmp/b-repo
          fi
          
          gh release delete "${{ steps.get_version.outputs.VERSION }}" --yes \
            --repo $B_REPO_OWNER/$B_REPO_NAME 2>/dev/null || true
          gh release create "${{ steps.get_version.outputs.VERSION }}" \
            --repo $B_REPO_OWNER/$B_REPO_NAME \
            --title "${{ steps.get_version.outputs.VERSION }}" \
            --notes "版本 ${{ steps.get_version.outputs.VERSION }}" \
            "$IPA_PATH"
        env:
          GH_TOKEN: ${{ secrets.B_REPO_TOKEN }}
          B_REPO_OWNER: ${{ secrets.B_REPO_OWNER }}
          B_REPO_NAME: ${{ secrets.B_REPO_NAME }}


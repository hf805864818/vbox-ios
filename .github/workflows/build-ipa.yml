name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 🎨 Generate AppIcon
        run: |
          python3 -c "
          import struct, zlib
          def png(w,h,c=(25,25,35)):
              r=b''
              for y in range(h): r+=b'\x00'
              for x in range(w): r+=bytes([c[0],c[1],c[2],255])
              def ck(t,d):
                  ct=t+d
                  return struct.pack('>I',len(d))+ct+struct.pack('>I',zlib.crc32(ct)&0xFFFFFFFF)
              s=b'\x89PNG\r\n\x1a\n'; ih=struct.pack('>IIBBBBB',w,h,8,2,0,0,0)
              return s+ck(b'IHDR',ih)+ck(b'IDAT',zlib.compress(r))+ck(b'IEND',b'')
          with open('vbox/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png','wb') as f:
              f.write(png(1024,1024))
          print('AppIcon OK')
          "

      - name: 🏗️ Build (signed Release)
        run: |
          # -allowProvisioningUpdates 让Xcode自动请求签名证书
          xcodebuild -project vbox.xcodeproj \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            -allowProvisioningUpdates \
            build 2>&1 | tee build.log | tail -30

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app!"; find ./Build -name "*.app" -type d; tail -50 build.log; exit 1
          fi
          echo "App: $APP"
          ls -la "$APP/"
          
          # 巨魔可以安装签名版，保留签名
          mkdir -p Payload
          cp -R "$APP" Payload/
          cd Payload && zip -r ../vbox.ipa vbox.app && cd ..
          echo "✅ IPA: $(ls -lh vbox.ipa)"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0


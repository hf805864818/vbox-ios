name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 🎨 Generate AppIcon
        run: |
          python3 -c "
          import struct, zlib
          def png(w,h,c=(25,25,35)):
              r=b''
              for y in range(h):
                  r+=b'\x00'
                  for x in range(w): r+=bytes([c[0],c[1],c[2],255])
              def ck(t,d):
                  ct=t+d
                  return struct.pack('>I',len(d))+ct+struct.pack('>I',zlib.crc32(ct)&0xFFFFFFFF)
              s=b'\x89PNG\r\n\x1a\n'; ih=struct.pack('>IIBBBBB',w,h,8,2,0,0,0)
              return s+ck(b'IHDR',ih)+ck(b'IDAT',zlib.compress(r))+ck(b'IEND',b'')
          with open('vbox/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png','wb') as f:
              f.write(png(1024,1024))
          print('AppIcon OK')
          "

      - name: 🏗️ Build signed first
        run: |
          # 第一步：用默认签名编译（使用 Automatic 签名）
          xcodebuild -project vbox.xcodeproj \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            build 2>&1 | tee build.log | tail -20
          
          echo "=== Checking build output ==="
          ls -la ./Build/Build/Products/Release-iphoneos/ 2>/dev/null
          
          APP="./Build/Build/Products/Release-iphoneos/vbox.app"
          if [ -d "$APP" ]; then
            echo "=== App contents ==="
            ls -la "$APP/"
            if [ -f "$APP/vbox" ]; then
              echo "✅ EXECUTABLE FOUND: $(file "$APP/vbox")"
              echo "Size: $(ls -lh "$APP/vbox" | awk '{print $5}')"
            else
              echo "❌ No vbox executable"
              find "$APP" -type f
            fi
          else
            echo "❌ No .app found"
            find ./Build -name "*.app" -type d
          fi

      - name: 🔓 Strip signing for TrollStore
        run: |
          APP="./Build/Build/Products/Release-iphoneos/vbox.app"
          
          if [ ! -d "$APP" ]; then
            echo "❌ No app found"
            exit 1
          fi
          
          # 如果有签名，去掉
          if [ -d "$APP/_CodeSignature" ]; then
            rm -rf "$APP/_CodeSignature"
            echo "Removed _CodeSignature"
          fi
          
          if [ -f "$APP/archived-expanded-entitlements.xcent" ]; then
            rm -f "$APP/archived-expanded-entitlements.xcent"
          fi
          
          # 确认可执行文件存在
          echo "=== Final app ==="
          ls -la "$APP/"
          
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null)
          echo "CFBundleExecutable = $EXEC"
          
          if [ -f "$APP/$EXEC" ]; then
            echo "✅ Binary $EXEC exists!"
            file "$APP/$EXEC"
          else
            echo "❌ Binary $EXEC NOT FOUND!"
            # 尝试找任何可执行文件
            find "$APP" -type f -exec sh -c 'file "$1" | grep -q "Mach-O"' _ {} \; -print
            exit 1
          fi

      - name: 📦 Package IPA
        run: |
          mkdir -p Payload
          cp -R ./Build/Build/Products/Release-iphoneos/vbox.app Payload/
          zip -r vbox.ipa Payload/
          echo "✅ IPA: $(ls -lh vbox.ipa)"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

      - name: ℹ️ Summary
        run: |
          echo "## ✅ vbox IPA" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ 下载 vbox-ipa 工件" >> $GITHUB_STEP_SUMMARY
          echo "📱 TrollStore 安装" >> $GITHUB_STEP_SUMMARY

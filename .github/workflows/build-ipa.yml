name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  MARKETING_VERSION: "0.5"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🏗️ Build
        run: |
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "Build number: $BUILD_NUM  Version: ${{ env.MARKETING_VERSION }}"
          
          xcodebuild -project vbox.xcodeproj \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            MARKETING_VERSION=${{ env.MARKETING_VERSION }} \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            build 2>&1

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "No .app!"; exit 1; fi
          rm -rf "$APP/_CodeSignature" "$APP/archived-expanded-entitlements.xcent" 2>/dev/null
          [ ! -f "$APP/vbox" ] && echo "No vbox!" && exit 1
          BUILD_NUM=$(git rev-list --count HEAD)
          IPA_NAME="vbox-${{ env.MARKETING_VERSION }}(build_$BUILD_NUM).ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r "$IPA_NAME" Payload/
          echo "IPA: $(ls -lh $IPA_NAME)"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MARKETING_VERSION }}
          name: v${{ env.MARKETING_VERSION }}
          body: |
            版本 ${{ env.MARKETING_VERSION }} (build ${{ github.run_number }})
            
            **最新改动:**
            - 查看 [commit](https://github.com/hf805864818/vbox-ios/commit/${{ github.sha }})
          draft: false
          prerelease: true
          files: ${{ env.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

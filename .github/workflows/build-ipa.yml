name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🔧 Fix pbxproj (add QuickJS files)
        run: |
          # 在 Sources 中追加 QJSSpiderEngine 等文件
          python3 -c "
import re
with open('vbox.xcodeproj/project.pbxproj', 'r') as f:
    content = f.read()

# 1. 确保 PBXBuildFile 有 QuickJS 相关
for build_id, fref_id, name in [
    ('A10011', 'B10011', 'QJSSpiderEngine.swift'),
    ('A10012', 'B10012', 'QuickJSBridge.m'),
    ('A10013', 'B10015', 'SubscriptionManager.swift'),
    ('A10014', 'B10016', 'CloudDriveManager.swift'),
    ('A10015', 'B10013', 'Assets.xcassets'),
    ('A10016', 'B10017', 'libquickjs.a'),
]:
    entry = f'{build_id} /* {name} in Sources */ = {{isa = PBXBuildFile; fileRef = {fref_id} /* {name} */; }};'
    if entry not in content:
        # 在 BuildFile section 结束前插入
        content = content.replace(
            '/* End PBXBuildFile section */',
            f'\t\t{entry}\n/* End PBXBuildFile section */'
        )

# 2. 确保 PBXFileReference 有 QuickJS 相关
for ref_id, ftype, name in [
    ('B10011', 'sourcecode.swift', 'QJSSpiderEngine.swift'),
    ('B10012', 'sourcecode.c.objc', 'QuickJSBridge.m'),
    ('B10015', 'sourcecode.swift', 'SubscriptionManager.swift'),
    ('B10016', 'sourcecode.swift', 'CloudDriveManager.swift'),
    ('B10017', 'archive.ar', 'libquickjs.a'),
    ('B10018', 'sourcecode.c.h', 'QuickJSBridge.h'),
]:
    entry = f'{ref_id} /* {name} */ = {{isa = PBXFileReference; lastKnownFileType = {ftype}; path = {name}; sourceTree = \"<group>\"; }};'
    if entry not in content:
        content = content.replace(
            '/* End PBXFileReference section */',
            f'\t\t{entry}\n/* End PBXFileReference section */'
        )

# 3. Services group 加文件
for ref_id, name in [
    ('B10011', 'QJSSpiderEngine.swift'),
    ('B10015', 'SubscriptionManager.swift'),
    ('B10016', 'CloudDriveManager.swift'),
]:
    entry = f'{ref_id} /* {name} */,'
    if entry not in content:
        content = content.replace(
            'B10007 /* SpiderRepository.swift */,',
            f'B10007 /* SpiderRepository.swift */,\n\t\t\t\t{entry}'
        )

# 4. 加 Libraries group
if 'G10020' not in content:
    content = content.replace(
        'G10010 /* Views */ = {',
        'G10020 /* Libraries */ = {\n\t\t\tisa = PBXGroup;\n\t\t\tchildren = (\n\t\t\t\tB10012 /* QuickJSBridge.m */,\n\t\t\t\tB10017 /* libquickjs.a */,\n\t\t\t\tB10018 /* QuickJSBridge.h */,\n\t\t\t);\n\t\t\tpath = Libraries;\n\t\t\tsourceTree = \"<group>\";\n\t\t};\n\t\tG10010 /* Views */ = {'
    )
    content = content.replace(
        'G10011 /* Resources */,',
        'G10011 /* Resources */, G10020 /* Libraries */,'
    )

# 5. Sources phase 加文件
src_entries = 'A10001, A10002, A10003, A10004, A10005, A10006, A10007, A10008, A10009, A10010, A10011, A10012, A10013, A10014'
old_src_pattern = r'A10001.*?A10010.*?\);'
if 'A10011' not in content:
    content = re.sub(
        r'files = \(\s*A10001.*?A10010[^)]*\);',
        f'files = ({src_entries},);',
        content,
        flags=re.DOTALL
    )

# 6. Frameworks phase
if 'P20003' not in content:
    content = content.replace(
        'P20001 /* Sources */,',
        'P20001 /* Sources */, P20003 /* Frameworks */,'
    )
    content = content.replace(
        '/* End PBXSourcesBuildPhase section */',
        '/* End PBXSourcesBuildPhase section */\n\n/* Begin PBXFrameworksBuildPhase section */\n\t\tP20003 /* Frameworks */ = {\n\t\t\tisa = PBXFrameworksBuildPhase;\n\t\t\tbuildActionMask = 2147483647;\n\t\t\tfiles = (\n\t\t\t\tA10016 /* libquickjs.a in Frameworks */,\n\t\t\t);\n\t\t\trunOnlyForDeploymentPostprocessing = 0;\n\t\t};\n/* End PBXFrameworksBuildPhase section */'
    )

# 7. Release 配置加链接参数
if 'LIBRARY_SEARCH_PATHS' not in content:
    content = content.replace(
        'LD_RUNPATH_SEARCH_PATHS = (\"$(inherited)\"',
        'LIBRARY_SEARCH_PATHS = (\"$(inherited)\", \"$(SRCROOT)/vbox/Libraries\");\n\t\t\t\tLD_RUNPATH_SEARCH_PATHS = (\"$(inherited)\"'
    )
    content = content.replace(
        'SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY',
        'SWIFT_OBJC_BRIDGING_HEADER = \"vbox/vbox-Bridging-Header.h\";\n\t\t\t\tOTHER_LDFLAGS = (\"-lquickjs\", \"-lobjc\");\n\t\t\t\tSWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY'
    )

with open('vbox.xcodeproj/project.pbxproj', 'w') as f:
    f.write(content)
print('✅ pbxproj fixed')
"

      - name: 🏗️ Build
        run: |
          xcodebuild -project vbox.xcodeproj \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            build 2>&1

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "No .app!"; exit 1; fi
          rm -rf "$APP/_CodeSignature" "$APP/archived-expanded-entitlements.xcent" 2>/dev/null
          if [ ! -f "$APP/vbox" ]; then echo "No vbox!"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r vbox.ipa Payload/
          echo "IPA: $(ls -lh vbox.ipa)"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

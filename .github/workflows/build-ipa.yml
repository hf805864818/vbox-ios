name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 🎨 Generate AppIcon
        run: |
          python3 -c "
          import struct, zlib
          def create_png(w, h, c=(30,30,30)):
              raw = b''
              for y in range(h):
                  raw += b'\x00'
                  for x in range(w): raw += bytes([c[0],c[1],c[2],255])
              def ck(t,d):
                  ct=t+d; crc=struct.pack('>I',zlib.crc32(ct)&0xFFFFFFFF)
                  return struct.pack('>I',len(d))+ct+crc
              s=b'\x89PNG\r\n\x1a\n'
              ih=struct.pack('>IIBBBBB',w,h,8,6,0,0,0)
              return s+ck(b'IHDR',ih)+ck(b'IDAT',zlib.compress(raw))+ck(b'IEND',b'')
          with open('vbox/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png','wb') as f:
              f.write(create_png(1024,1024))
          print('✅ AppIcon generated')
          "

      - name: 🏗️ Build
        run: |
          # 使用更稳定的构建方式
          xcodebuild -project vbox.xcodeproj \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            -derivedDataPath ./Build \
            -quiet 2>&1 || true
          
          # 查看编译结果
          echo "=== Build result ==="
          ls -la ./Build/Build/Products/Release-iphoneos/ 2>/dev/null || echo "No release output"
          
          # 查找编译产物
          APP=""
          if [ -d "./Build/Build/Products/Release-iphoneos/vbox.app" ]; then
            APP="./Build/Build/Products/Release-iphoneos/vbox.app"
          elif [ -d "./Build/Products/Release-iphoneos/vbox.app" ]; then
            APP="./Build/Products/Release-iphoneos/vbox.app"
          fi
          
          if [ -z "$APP" ]; then
            echo "❌ Cannot find .app!"
            find ./Build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          
          echo "✅ Found app at: $APP"
          echo "Contents:"
          ls -la "$APP/"
          
          # 检查是否有可执行文件
          if [ -f "$APP/vbox" ]; then
            echo "✅ Executable found: $(file "$APP/vbox")"
          else
            echo "⚠️ No executable named 'vbox', listing all files:"
            find "$APP" -type f
          fi

      - name: 📦 Package IPA
        run: |
          APP="./Build/Build/Products/Release-iphoneos/vbox.app"
          if [ ! -d "$APP" ]; then
            APP="./Build/Products/Release-iphoneos/vbox.app"
          fi
          
          # 确保可执行文件存在
          if [ ! -f "$APP/vbox" ]; then
            echo "⚠️ No executable 'vbox' found. Checking binary..."
            BIN=$(find "$APP" -type f -perm +111 -o -type f -name "vbox" | head -1)
            if [ -z "$BIN" ]; then
              BIN=$(find "$APP" -type f | grep -v '\.plist\|\.png\|\.car\|\.lproj' | head -1)
            fi
            echo "Best binary candidate: $BIN"
          fi
          
          # 打包 IPA
          mkdir -p Payload
          cp -R "$APP" Payload/
          cd Payload
          # 巨魔需要 Info.plist 中的 CFBundleExecutable
          echo "Checking Info.plist:"
          /usr/libexec/PlistBuddy -c "Print" vbox.app/Info.plist 2>/dev/null | head -20
          cd ..
          zip -r vbox.ipa Payload/
          echo "✅ IPA: $(ls -lh vbox.ipa)"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

      - name: ℹ️ Summary
        run: |
          echo "## ✅ vbox IPA" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | \`com.vbox.iosplayer\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 最低iOS | 15.0 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ 下载 vbox-ipa 工件" >> $GITHUB_STEP_SUMMARY
          echo "📱 用 TrollStore 安装" >> $GITHUB_STEP_SUMMARY

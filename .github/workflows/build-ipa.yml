name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      mpvkit_source_url:
        description: "可选：MPVKit.xcframework.zip 直链；不填则自动查找 mpvkit-wrapper-* Release"
        required: false
        default: ""
        type: string
      mpvkit_release_tag:
        description: "可选：指定 mpvkit-wrapper-* Release 标签"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🎬 Prepare MPVKit.xcframework
        env:
          GH_TOKEN: ${{ github.token }}
          MPVKIT_SOURCE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.mpvkit_source_url || '' }}
          MPVKIT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.mpvkit_release_tag || '' }}
        run: |
          chmod +x scripts/mpv/download-mpvkit-framework.sh
          scripts/mpv/download-mpvkit-framework.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/vbox/Libraries/MPV"

      - name: 📖 获取版本号
        id: get_version
        run: |
          MARKETING_VERSION=$(plutil -extract CFBundleShortVersionString raw vbox/Info.plist)
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Version: $MARKETING_VERSION Build: $BUILD_NUM"

      - name: 📦 Install CocoaPods dependencies
        run: |
          sudo gem install cocoapods --no-document
          pod install --repo-update

      - name: 🏗️ Build
        run: |
          xcodebuild -workspace vbox.xcworkspace \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            MARKETING_VERSION=${{ steps.get_version.outputs.MARKETING_VERSION }} \
            CURRENT_PROJECT_VERSION=${{ steps.get_version.outputs.BUILD_NUM }} \
            build 2>&1

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          [ -z "$APP" ] && echo "No .app!" && exit 1
          rm -rf "$APP/_CodeSignature" "$APP/archived-expanded-entitlements.xcent" 2>/dev/null
          [ ! -f "$APP/vbox" ] && echo "No vbox!" && exit 1
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r vbox.ipa Payload/
          echo "IPA: $(ls -lh vbox.ipa)"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

      - name: 🚀 Release
        run: |
          gh release delete "v${{ steps.get_version.outputs.MARKETING_VERSION }}" --yes 2>/dev/null || true
          gh release create "v${{ steps.get_version.outputs.MARKETING_VERSION }}" \
            --title "v${{ steps.get_version.outputs.MARKETING_VERSION }}" \
            --notes "版本 ${{ steps.get_version.outputs.MARKETING_VERSION }} (build ${{ steps.get_version.outputs.BUILD_NUM }})" \
            vbox.ipa
        env:
          GH_TOKEN: ${{ github.token }}

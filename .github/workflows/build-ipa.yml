name: Build IPA (巨魔安装版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🏗️ Build
        run: |
          xcodebuild -project vbox.xcodeproj \
            -scheme vbox \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath ./Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=com.vbox.iosplayer \
            build 2>&1

      - name: 📦 Package IPA
        run: |
          APP=$(find ./Build -name "vbox.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "No .app!"; exit 1; fi
          rm -rf "$APP/_CodeSignature" "$APP/archived-expanded-entitlements.xcent" 2>/dev/null
          if [ ! -f "$APP/vbox" ]; then echo "No vbox!"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r vbox.ipa Payload/
          echo "IPA: $(ls -lh vbox.ipa)"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: vbox-ipa
          path: vbox.ipa
          compression-level: 0

name: Build MPV Framework

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式"
        required: true
        default: "package-prebuilt"
        type: choice
        options:
          - package-prebuilt
          - source-build-libmpv
      framework_kind:
        description: "framework 类型"
        required: true
        default: "libmpv"
        type: choice
        options:
          - MPVKit
          - libmpv
      source_url:
        description: "已有 .xcframework 压缩包下载地址，package-prebuilt 模式必填"
        required: false
        default: ""
        type: string
      publish_release:
        description: "是否发布到 GitHub Release"
        required: true
        default: false
        type: boolean

jobs:
  build-mpv-framework:
    runs-on: macos-15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🧰 Prepare scripts
        run: chmod +x scripts/mpv/*.sh

      - name: 📦 Package prebuilt xcframework
        if: ${{ inputs.mode == 'package-prebuilt' }}
        run: |
          if [ -z "${{ inputs.source_url }}" ]; then
            echo "package-prebuilt 模式需要填写 source_url"
            exit 2
          fi
          FRAMEWORK_PATH="$(scripts/mpv/prepare-prebuilt-framework.sh "${{ inputs.source_url }}" "${{ inputs.framework_kind }}" mpv-work | tail -1)"
          scripts/mpv/package-xcframework.sh "$FRAMEWORK_PATH" mpv-artifacts "${{ inputs.framework_kind }}"

      - name: 🏗️ Build libmpv from source
        if: ${{ inputs.mode == 'source-build-libmpv' }}
        run: |
          if [ "${{ inputs.framework_kind }}" != "libmpv" ]; then
            echo "源码构建模式当前只预留 libmpv"
            exit 2
          fi
          scripts/mpv/build-libmpv-ios.sh mpv-artifacts

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.framework_kind }}-xcframework
          path: |
            mpv-artifacts/*.zip
            mpv-artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0

      - name: 🚀 Publish Release
        if: ${{ inputs.publish_release }}
        run: |
          TAG="mpv-${{ inputs.framework_kind }}-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "自动打包 ${{ inputs.framework_kind }}.xcframework。mode=${{ inputs.mode }}" \
            mpv-artifacts/*.zip mpv-artifacts/*.sha256
        env:
          GH_TOKEN: ${{ github.token }}

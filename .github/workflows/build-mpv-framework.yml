name: Build MPV Framework

on:
  push:
    branches:
      - feature/mpv-framework-actions
    paths:
      - ".github/workflows/build-mpv-framework.yml"
      - "scripts/mpv/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式"
        required: true
        default: "package-prebuilt"
        type: choice
        options:
          - package-prebuilt
          - source-build-libmpv
      framework_kind:
        description: "framework 类型"
        required: true
        default: "libmpv"
        type: choice
        options:
          - MPVKit
          - libmpv
      source_url:
        description: "已有 .xcframework 压缩包下载地址，package-prebuilt 模式必填"
        required: false
        default: ""
        type: string
      publish_release:
        description: "是否发布到 GitHub Release"
        required: true
        default: false
        type: boolean

jobs:
  build-mpv-framework:
    runs-on: macos-15
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'source-build-libmpv' }}
      FRAMEWORK_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.framework_kind || 'libmpv' }}
      SOURCE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.source_url || '' }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🧰 Prepare scripts
        run: |
          brew update
          brew install meson ninja pkg-config nasm yasm
          chmod +x scripts/mpv/*.sh

      - name: ♻️ Cache MPV sources/build
        if: ${{ env.MODE == 'source-build-libmpv' }}
        uses: actions/cache@v4
        with:
          path: |
            mpv-source-build/src
          key: mpv-src-${{ runner.os }}-mpv-v0.39.0-ffmpeg-n6.1.1

      - name: 📦 Package prebuilt xcframework
        if: ${{ env.MODE == 'package-prebuilt' }}
        run: |
          if [ -z "$SOURCE_URL" ]; then
            echo "package-prebuilt 模式需要填写 source_url"
            exit 2
          fi
          FRAMEWORK_PATH="$(scripts/mpv/prepare-prebuilt-framework.sh "$SOURCE_URL" "$FRAMEWORK_KIND" mpv-work | tail -1)"
          scripts/mpv/package-xcframework.sh "$FRAMEWORK_PATH" mpv-artifacts "$FRAMEWORK_KIND"

      - name: 🏗️ Build libmpv from source
        if: ${{ env.MODE == 'source-build-libmpv' }}
        run: |
          if [ "$FRAMEWORK_KIND" != "libmpv" ]; then
            echo "源码构建模式当前只预留 libmpv"
            exit 2
          fi
          scripts/mpv/build-libmpv-ios.sh mpv-artifacts

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FRAMEWORK_KIND }}-xcframework
          path: |
            mpv-artifacts/*.zip
            mpv-artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0

      - name: 🚀 Publish Release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        run: |
          TAG="mpv-${FRAMEWORK_KIND}-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "自动打包 ${FRAMEWORK_KIND}.xcframework。mode=${MODE}" \
            mpv-artifacts/*.zip mpv-artifacts/*.sha256
        env:
          GH_TOKEN: ${{ github.token }}

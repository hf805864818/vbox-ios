name: Build MPVKit binary bundle

on:
  push:
    branches:
      - rebuild-8db3547
    paths:
      - ".github/workflows/mpv-build.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      mpvkit_ref:
        description: "mpvkit/MPVKit 分支或 tag"
        required: true
        default: "main"
        type: string
      product:
        description: "MPVKit 版本"
        required: true
        default: "MPVKit"
        type: choice
        options:
          - MPVKit
          - MPVKit-GPL
      publish_release:
        description: "是否发布到本仓库 Release"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15
    env:
      MPVKIT_REPO: "https://github.com/mpvkit/MPVKit.git"
      MPVKIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mpvkit_ref || 'main' }}
      MPVKIT_PRODUCT: ${{ github.event_name == 'workflow_dispatch' && inputs.product || 'MPVKit' }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}

    steps:
      - name: 📥 Checkout this repository
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🧰 Prepare tools
        run: |
          xcodebuild -version
          swift --version
          mkdir -p mpvkit-build mpvkit-artifacts

      - name: 📥 Clone MPVKit
        run: |
          git clone --depth 1 --branch "$MPVKIT_REF" "$MPVKIT_REPO" mpvkit-build/MPVKit
          git -C mpvkit-build/MPVKit rev-parse --short HEAD
          cd mpvkit-build/MPVKit
          make help

      - name: 🏗️ Build MPVKit official binary dependencies
        working-directory: mpvkit-build/MPVKit
        run: |
          set -euo pipefail
          if [ "$MPVKIT_PRODUCT" = "MPVKit-GPL" ]; then
            make gpl platform=ios,isimulator
          else
            make build platform=ios,isimulator
          fi

      - name: 📦 Package MPVKit binary bundle
        run: |
          set -euo pipefail
          RELEASE_DIR="mpvkit-build/MPVKit/dist/release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "未找到官方 release 目录，输出 dist 内容："
            find mpvkit-build/MPVKit -maxdepth 4 -type d -name "release" -o -name "dist" | sed -n '1,200p'
            exit 1
          fi

          echo "release 内容："
          find "$RELEASE_DIR" -maxdepth 2 -type f | sort | sed -n '1,240p'

          ZIP_NAME="${MPVKIT_PRODUCT}-binary-bundle.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RELEASE_DIR" "mpvkit-artifacts/$ZIP_NAME"
          shasum -a 256 "mpvkit-artifacts/$ZIP_NAME" | tee "mpvkit-artifacts/$ZIP_NAME.sha256"

          # 如果官方构建将来产出 MPVKit.xcframework，也一并单独打包。
          FOUND_MPVKIT="$(find "$RELEASE_DIR" -name "MPVKit.xcframework" -type d | head -1 || true)"
          if [ -n "$FOUND_MPVKIT" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$FOUND_MPVKIT" "mpvkit-artifacts/MPVKit.xcframework.zip"
            shasum -a 256 "mpvkit-artifacts/MPVKit.xcframework.zip" | tee "mpvkit-artifacts/MPVKit.xcframework.zip.sha256"
          fi

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MPVKIT_PRODUCT }}-xcframework
          path: |
            mpvkit-artifacts/*.zip
            mpvkit-artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0

      - name: 🧾 Dump build logs on failure
        if: failure()
        run: |
          echo "===== MPVKit build logs ====="
          find mpvkit-build/MPVKit -name "*.log" -type f -print -exec tail -200 {} \; 2>/dev/null | sed -n '1,260p'
          echo "===== dist tree ====="
          find mpvkit-build/MPVKit/dist -maxdepth 6 -print 2>/dev/null | sed -n '1,260p'

      - name: 🚀 Publish Release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        run: |
          TAG="mpvkit-${MPVKIT_PRODUCT}-bundle-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "自动构建 ${MPVKIT_PRODUCT} 二进制依赖包，来源 ${MPVKIT_REPO}@${MPVKIT_REF}" \
            mpvkit-artifacts/*.zip mpvkit-artifacts/*.sha256
        env:
          GH_TOKEN: ${{ github.token }}

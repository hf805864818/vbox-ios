name: Build MPVKit.xcframework wrapper

on:
  push:
    branches:
      - rebuild-8db3547
    paths:
      - ".github/workflows/mpv-build.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      mpvkit_ref:
        description: "mpvkit/MPVKit 分支或 tag"
        required: true
        default: "main"
        type: string
      product:
        description: "MPVKit 版本"
        required: true
        default: "MPVKit"
        type: choice
        options:
          - MPVKit
          - MPVKit-GPL
      publish_release:
        description: "是否发布到本仓库 Release"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15
    env:
      MPVKIT_REPO: "https://github.com/mpvkit/MPVKit.git"
      MPVKIT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.mpvkit_ref || 'main' }}
      MPVKIT_PRODUCT: ${{ github.event_name == 'workflow_dispatch' && inputs.product || 'MPVKit' }}
      MPVKIT_WRAPPER_SCHEME: "MPVKitWrapper"
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}

    steps:
      - name: 📥 Checkout this repository
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 🧰 Prepare tools
        run: |
          xcodebuild -version
          swift --version
          mkdir -p mpvkit-build mpvkit-artifacts

      - name: 📥 Clone MPVKit
        run: |
          git clone --depth 1 --branch "$MPVKIT_REF" "$MPVKIT_REPO" mpvkit-build/MPVKit
          git -C mpvkit-build/MPVKit rev-parse --short HEAD
          cd mpvkit-build/MPVKit
          make help

      - name: 🧱 Create local MPVKit wrapper package
        run: |
          set -euo pipefail
          if [ "$MPVKIT_PRODUCT" = "MPVKit-GPL" ]; then
            echo "当前 wrapper 先支持 LGPL 的 MPVKit；GPL 版本后续单独处理模块名。"
            exit 2
          fi

          mkdir -p mpvkit-build/Wrapper/Sources/MPVKitWrapper
          cat > mpvkit-build/Wrapper/Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "MPVKitWrapper",
              platforms: [.iOS(.v14)],
              products: [
                  .library(name: "MPVKitWrapper", type: .dynamic, targets: ["MPVKitWrapper"])
              ],
              dependencies: [
                  .package(path: "../MPVKit")
              ],
              targets: [
                  .target(
                      name: "MPVKitWrapper",
                      dependencies: [
                          .product(name: "MPVKit", package: "MPVKit")
                      ],
                      path: "Sources/MPVKitWrapper"
                  )
              ]
          )
          EOF

          cat > mpvkit-build/Wrapper/Sources/MPVKitWrapper/MPVKitWrapper.swift <<'EOF'
          @_exported import _MPVKit

          public enum MPVKitWrapperInfo {
              public static let name = "MPVKit"
              public static let source = "mpvkit/MPVKit"
          }
          EOF

          cd mpvkit-build/Wrapper
          xcodebuild -list

      - name: 🏗️ Archive MPVKit wrapper for iOS device
        working-directory: mpvkit-build/Wrapper
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme "$MPVKIT_WRAPPER_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/mpvkit-build/archives/ios.xcarchive" \
            -derivedDataPath "$GITHUB_WORKSPACE/mpvkit-build/DerivedData-iOS" \
            SKIP_INSTALL=NO \
            PRODUCT_NAME=MPVKit \
            PRODUCT_MODULE_NAME=MPVKit \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            ENABLE_BITCODE=NO

      - name: 🏗️ Archive MPVKit wrapper for iOS simulator
        working-directory: mpvkit-build/Wrapper
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme "$MPVKIT_WRAPPER_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "$GITHUB_WORKSPACE/mpvkit-build/archives/isimulator.xcarchive" \
            -derivedDataPath "$GITHUB_WORKSPACE/mpvkit-build/DerivedData-iSimulator" \
            SKIP_INSTALL=NO \
            PRODUCT_NAME=MPVKit \
            PRODUCT_MODULE_NAME=MPVKit \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            ENABLE_BITCODE=NO

      - name: 📦 Create MPVKit.xcframework
        run: |
          set -euo pipefail
          DEVICE_FRAMEWORK="$(find mpvkit-build/archives/ios.xcarchive -name "MPVKit.framework" -type d | head -1)"
          SIMULATOR_FRAMEWORK="$(find mpvkit-build/archives/isimulator.xcarchive -name "MPVKit.framework" -type d | head -1)"
          if [ -z "$DEVICE_FRAMEWORK" ]; then
            DEVICE_FRAMEWORK="$(find mpvkit-build/archives/ios.xcarchive -name "MPVKitWrapper.framework" -type d | head -1)"
          fi
          if [ -z "$SIMULATOR_FRAMEWORK" ]; then
            SIMULATOR_FRAMEWORK="$(find mpvkit-build/archives/isimulator.xcarchive -name "MPVKitWrapper.framework" -type d | head -1)"
          fi

          if [ -z "$DEVICE_FRAMEWORK" ] || [ -z "$SIMULATOR_FRAMEWORK" ]; then
            echo "未找到 MPVKit.framework，输出 archive 目录："
            find mpvkit-build/archives -maxdepth 8 -print | sed -n '1,260p'
            exit 1
          fi

          echo "Device framework: $DEVICE_FRAMEWORK"
          echo "Simulator framework: $SIMULATOR_FRAMEWORK"

          xcodebuild -create-xcframework \
            -framework "$DEVICE_FRAMEWORK" \
            -framework "$SIMULATOR_FRAMEWORK" \
            -output "mpvkit-artifacts/MPVKit.xcframework"

          ditto -c -k --sequesterRsrc --keepParent \
            "mpvkit-artifacts/MPVKit.xcframework" \
            "mpvkit-artifacts/MPVKit.xcframework.zip"

          shasum -a 256 "mpvkit-artifacts/MPVKit.xcframework.zip" | tee "mpvkit-artifacts/MPVKit.xcframework.zip.sha256"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPVKit-xcframework
          path: |
            mpvkit-artifacts/MPVKit.xcframework.zip
            mpvkit-artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0

      - name: 🧾 Dump build logs on failure
        if: failure()
        run: |
          echo "===== MPVKit wrapper logs ====="
          find mpvkit-build -name "*.xcactivitylog" -type f -print | sed -n '1,80p'
          echo "===== archives ====="
          find mpvkit-build/archives -maxdepth 8 -print 2>/dev/null | sed -n '1,260p'

      - name: 🚀 Publish Release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        run: |
          TAG="mpvkit-wrapper-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "自动构建 MPVKit.xcframework wrapper，来源 ${MPVKIT_REPO}@${MPVKIT_REF}" \
            mpvkit-artifacts/MPVKit.xcframework.zip mpvkit-artifacts/*.sha256
        env:
          GH_TOKEN: ${{ github.token }}
